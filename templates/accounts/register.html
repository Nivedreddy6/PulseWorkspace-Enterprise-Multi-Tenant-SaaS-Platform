{% extends 'base.html' %}

{% block title %}Create Workspace & Account | PulseWorkspace SaaS{% endblock %}

{% block content %}
<div style="min-height:80vh; display:flex; align-items:center; justify-content:center; padding:20px 0;">
  <div style="width:100%; max-width:480px; background:var(--bg-glass-card); backdrop-filter:blur(16px); border:1px solid var(--border-accent); border-radius:var(--radius-lg); padding:36px; box-shadow:var(--shadow-md);">
    
    <div style="text-align:center; margin-bottom:28px;">
      <div style="width:52px; height:52px; background:linear-gradient(135deg, #6366f1, #06b6d4); border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; box-shadow:0 0 20px rgba(99, 102, 241, 0.4);">
        <i class="fa-solid fa-rocket" style="font-size:1.5rem; color:#fff;"></i>
      </div>
      <h2 style="font-size:1.5rem; font-weight:800; letter-spacing:-0.02em;">Start Free Workspace</h2>
      <p style="color:var(--text-muted); font-size:0.88rem; margin-top:4px;">Deploy your enterprise team workspace in seconds</p>
    </div>

    <form method="POST" action="{% url 'register' %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="company_name">Company / Workspace Name</label>
        <input type="text" id="company_name" name="company_name" class="form-control" placeholder="e.g. Acme Innovations" required>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
        <div class="form-group">
          <label class="form-label" for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" class="form-control" placeholder="Jane" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Doe" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. janedoe" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Work Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="jane@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px; padding:12px;">
        <i class="fa-solid fa-sparkles"></i>
        <span>Create Workspace & Sign Up</span>
      </button>
    </form>

    <div style="text-align:center; margin-top:24px; font-size:0.85rem; color:var(--text-muted);">
      Already have an account? 
      <a href="{% url 'login' %}" style="color:var(--accent-primary); text-decoration:none; font-weight:600;">Sign In</a>
    </div>

  </div>
</div>
{% endblock %}
