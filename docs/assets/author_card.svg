<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 145" width="100%" height="145">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="authorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322">
        <animate attributeName="stop-color" values="#0c1322;#161d36;#0c1322" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#080c16">
        <animate attributeName="stop-color" values="#080c16;#0f172a;#080c16" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="authorBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#06b6d4;#ec4899;#6366f1" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#ec4899;#6366f1;#06b6d4" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#6366f1;#06b6d4;#ec4899" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmer Sweep -->
    <linearGradient id="authorShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- Name Text Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="authorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="736" height="141" rx="16" />
    </clipPath>
  </defs>

  <style>
    @keyframes authorSweep {
      0% { transform: translateX(-150px) skewX(-25deg); }
      50%, 100% { transform: translateX(850px) skewX(-25deg); }
    }
    @keyframes avatarPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 10px #6366f1); }
    }
    .author-shimmer {
      animation: authorSweep 4.5s ease-in-out infinite;
    }
    .avatar-ring {
      transform-origin: 75px 72px;
      animation: avatarPulse 2.5s ease-in-out infinite;
    }
    .author-name {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .author-role {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .author-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
    }
  </style>

  <!-- Base Card Container Clipped -->
  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="736" height="141" rx="16" fill="url(#authorBg)" />
    <!-- Sliding Light Beam -->
    <rect class="author-shimmer" x="0" y="0" width="70" height="145" fill="url(#authorShimmer)" />
  </g>

  <!-- Border Outline -->
  <rect x="2" y="2" width="736" height="141" rx="16" fill="none" stroke="url(#authorBorder)" stroke-width="1.8" />

  <!-- Avatar Circle with Glowing Ring -->
  <g class="avatar-ring" filter="url(#authorGlow)">
    <circle cx="75" cy="72" r="38" fill="none" stroke="url(#authorBorder)" stroke-width="2" />
    <circle cx="75" cy="72" r="32" fill="#1e1b4b" />
    <text x="75" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="middle">NR</text>
  </g>

  <!-- Author Info -->
  <g transform="translate(135, 30)">
    <!-- Role Tag -->
    <rect x="0" y="0" width="168" height="20" rx="10" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="0.8" />
    <text x="84" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#e0e7ff" text-anchor="middle">ARCHITECT &amp; CREATOR</text>

    <!-- Name -->
    <text x="0" y="44" class="author-name" fill="url(#nameGrad)">Nived Reddy</text>

    <!-- Title / Bio -->
    <text x="0" y="65" class="author-role">Software Engineer &#8226; Full-Stack &amp; Enterprise Cloud Systems Specialist</text>

    <!-- Skill / Portfolio Tags -->
    <g transform="translate(0, 78)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="145" height="22" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="0.8" />
      <text x="72" y="15" class="author-badge" fill="#67e8f9" text-anchor="middle">Django 6 &amp; DRF Core</text>

      <!-- Tag 2 -->
      <rect x="155" y="0" width="165" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="0.8" />
      <text x="237" y="15" class="author-badge" fill="#6ee7b7" text-anchor="middle">Multi-Tenant Isolation</text>

      <!-- Tag 3 -->
      <rect x="330" y="0" width="150" height="22" rx="6" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="0.8" />
      <text x="405" y="15" class="author-badge" fill="#f472b6" text-anchor="middle">OpenAPI 3.0 &amp; Docker</text>
    </g>
  </g>

  <!-- Right Decorative Pulse Icon -->
  <g transform="translate(670, 72)" filter="url(#authorGlow)">
    <circle cx="0" cy="0" r="18" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1.5" />
    <path d="M -8 0 L -3 0 L 0 -7 L 3 8 L 6 -3 L 8 0" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
