<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="370">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="credBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <!-- Persona Card 1: Owner (Purple/Indigo) -->
    <linearGradient id="ownerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221545" />
      <stop offset="100%" stop-color="#0e1628" />
    </linearGradient>
    <linearGradient id="borderOwner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#6366f1;#a855f7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Persona Card 2: Admin (Cyan/Blue) -->
    <linearGradient id="adminCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d40" />
      <stop offset="100%" stop-color="#0e1628" />
    </linearGradient>
    <linearGradient id="borderAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#06b6d4" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Persona Card 3: Member (Emerald/Green) -->
    <linearGradient id="memberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09382b" />
      <stop offset="100%" stop-color="#0e1628" />
    </linearGradient>
    <linearGradient id="borderMember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#10b981" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes onlineBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .float-1 { animation: floatCard 4s ease-in-out infinite; }
    .float-2 { animation: floatCard 4.5s ease-in-out infinite 0.5s; }
    .float-3 { animation: floatCard 4.2s ease-in-out infinite 1s; }
    .pulse-halo { animation: pulseRing 3s ease-in-out infinite; transform-origin: center; }
    .online-dot { animation: onlineBlink 1.5s ease-in-out infinite; }

    .role-title {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .person-name {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      fill: #94a3b8;
    }
    .chip-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
    }
    .scope-desc {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 400;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="920" height="370" rx="18" fill="url(#credBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- ==========================================
       PERSONA 1: WORKSPACE OWNER
       ========================================== -->
  <g transform="translate(25, 25)" class="float-1">
    <rect width="275" height="320" rx="16" fill="url(#ownerCard)" stroke="url(#borderOwner)" stroke-width="1.5" />
    
    <!-- Top Header &amp; Role Badge -->
    <rect x="18" y="18" width="95" height="22" rx="11" fill="rgba(168, 85, 247, 0.25)" stroke="#c084fc" stroke-width="0.8" />
    <text x="65" y="33" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#f3e8ff" text-anchor="middle">OWNER ROLE</text>
    
    <!-- Online status -->
    <circle cx="245" cy="29" r="4" fill="#34d399" class="online-dot" />
    <text x="235" y="33" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="end">Ready</text>

    <!-- Avatar with Glowing Halo -->
    <g transform="translate(137, 85)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#a855f7" stroke-width="2" class="pulse-halo" />
      <circle cx="0" cy="0" r="26" fill="#4f46e5" filter="url(#haloGlow)" />
      <text x="0" y="7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">DC</text>
    </g>

    <!-- Name and Title -->
    <text x="137" y="132" class="role-title" fill="#ffffff" text-anchor="middle">&#128081; Workspace Owner</text>
    <text x="137" y="148" class="person-name" text-anchor="middle">David Chen &#8226; Chief Architect</text>

    <!-- Credentials Block -->
    <g transform="translate(18, 168)">
      <rect width="239" height="72" rx="8" fill="rgba(0, 0, 0, 0.45)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
      
      <text x="14" y="26" class="chip-label" fill="#a5b4fc">Username:</text>
      <rect x="90" y="12" width="70" height="20" rx="4" fill="#4338ca" />
      <text x="125" y="26" class="chip-label" fill="#ffffff" text-anchor="middle">admin</text>

      <text x="14" y="54" class="chip-label" fill="#a5b4fc">Password:</text>
      <rect x="90" y="40" width="105" height="20" rx="4" fill="rgba(255, 255, 255, 0.1)" />
      <text x="142" y="54" class="chip-label" fill="#fde047" text-anchor="middle">password123</text>
    </g>

    <!-- Scope Description -->
    <text x="137" y="270" class="scope-desc" text-anchor="middle">Full administrative control &#8226; Billing</text>
    <text x="137" y="286" class="scope-desc" text-anchor="middle">Workspaces creation &#8226; Audit logs</text>
  </g>

  <!-- ==========================================
       PERSONA 2: WORKSPACE ADMIN
       ========================================== -->
  <g transform="translate(322, 25)" class="float-2">
    <rect width="275" height="320" rx="16" fill="url(#adminCard)" stroke="url(#borderAdmin)" stroke-width="1.5" />
    
    <!-- Top Header &amp; Role Badge -->
    <rect x="18" y="18" width="95" height="22" rx="11" fill="rgba(6, 182, 212, 0.25)" stroke="#22d3ee" stroke-width="0.8" />
    <text x="65" y="33" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#cffafe" text-anchor="middle">ADMIN ROLE</text>
    
    <!-- Online status -->
    <circle cx="245" cy="29" r="4" fill="#34d399" class="online-dot" />
    <text x="235" y="33" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="end">Ready</text>

    <!-- Avatar with Glowing Halo -->
    <g transform="translate(137, 85)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#06b6d4" stroke-width="2" class="pulse-halo" />
      <circle cx="0" cy="0" r="26" fill="#0891b2" filter="url(#haloGlow)" />
      <text x="0" y="7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">SC</text>
    </g>

    <!-- Name and Title -->
    <text x="137" y="132" class="role-title" fill="#ffffff" text-anchor="middle">&#128737; Workspace Admin</text>
    <text x="137" y="148" class="person-name" text-anchor="middle">Sarah Connor &#8226; VP Engineering</text>

    <!-- Credentials Block -->
    <g transform="translate(18, 168)">
      <rect width="239" height="72" rx="8" fill="rgba(0, 0, 0, 0.45)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
      
      <text x="14" y="26" class="chip-label" fill="#67e8f9">Username:</text>
      <rect x="90" y="12" width="105" height="20" rx="4" fill="#0e7490" />
      <text x="142" y="26" class="chip-label" fill="#ffffff" text-anchor="middle">sarah_lead</text>

      <text x="14" y="54" class="chip-label" fill="#67e8f9">Password:</text>
      <rect x="90" y="40" width="105" height="20" rx="4" fill="rgba(255, 255, 255, 0.1)" />
      <text x="142" y="54" class="chip-label" fill="#fde047" text-anchor="middle">password123</text>
    </g>

    <!-- Scope Description -->
    <text x="137" y="270" class="scope-desc" text-anchor="middle">Project lifecycle &#8226; Member invites</text>
    <text x="137" y="286" class="scope-desc" text-anchor="middle">Role assignment &#8226; Pipeline review</text>
  </g>

  <!-- ==========================================
       PERSONA 3: WORKSPACE MEMBER
       ========================================== -->
  <g transform="translate(620, 25)" class="float-3">
    <rect width="275" height="320" rx="16" fill="url(#memberCard)" stroke="url(#borderMember)" stroke-width="1.5" />
    
    <!-- Top Header &amp; Role Badge -->
    <rect x="18" y="18" width="105" height="22" rx="11" fill="rgba(16, 185, 129, 0.25)" stroke="#34d399" stroke-width="0.8" />
    <text x="70" y="33" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#d1fae5" text-anchor="middle">MEMBER ROLE</text>
    
    <!-- Online status -->
    <circle cx="245" cy="29" r="4" fill="#34d399" class="online-dot" />
    <text x="235" y="33" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="end">Ready</text>

    <!-- Avatar with Glowing Halo -->
    <g transform="translate(137, 85)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#10b981" stroke-width="2" class="pulse-halo" />
      <circle cx="0" cy="0" r="26" fill="#059669" filter="url(#haloGlow)" />
      <text x="0" y="7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">AM</text>
    </g>

    <!-- Name and Title -->
    <text x="137" y="132" class="role-title" fill="#ffffff" text-anchor="middle">&#128187; Workspace Member</text>
    <text x="137" y="148" class="person-name" text-anchor="middle">Alex Mercer &#8226; Backend Engineer</text>

    <!-- Credentials Block -->
    <g transform="translate(18, 168)">
      <rect width="239" height="72" rx="8" fill="rgba(0, 0, 0, 0.45)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      
      <text x="14" y="26" class="chip-label" fill="#6ee7b7">Username:</text>
      <rect x="90" y="12" width="90" height="20" rx="4" fill="#047857" />
      <text x="135" y="26" class="chip-label" fill="#ffffff" text-anchor="middle">alex_dev</text>

      <text x="14" y="54" class="chip-label" fill="#6ee7b7">Password:</text>
      <rect x="90" y="40" width="105" height="20" rx="4" fill="rgba(255, 255, 255, 0.1)" />
      <text x="142" y="54" class="chip-label" fill="#fde047" text-anchor="middle">password123</text>
    </g>

    <!-- Scope Description -->
    <text x="137" y="270" class="scope-desc" text-anchor="middle">Task creation &#8226; Kanban progression</text>
    <text x="137" y="286" class="scope-desc" text-anchor="middle">Status updating &#8226; API token execution</text>
  </g>
</svg>
