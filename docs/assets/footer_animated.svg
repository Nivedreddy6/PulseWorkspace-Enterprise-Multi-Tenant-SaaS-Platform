<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16">
        <animate attributeName="stop-color" values="#080c16;#0e172a;#080c16" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#10172a">
        <animate attributeName="stop-color" values="#10172a;#1e1b4b;#10172a" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#060911">
        <animate attributeName="stop-color" values="#060911;#0b1329;#060911" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Gradient for Top Border -->
    <linearGradient id="footerBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#06b6d4;#ec4899;#a855f7;#6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#ec4899;#a855f7;#6366f1;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#a855f7;#6366f1;#06b6d4;#ec4899" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#6366f1;#06b6d4;#ec4899;#a855f7" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="footerTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="1" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="footerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="iconHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #ec4899); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -120; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes floatFooter {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .heart-logo {
      transform-origin: 450px 58px;
      animation: pulseHeart 2s ease-in-out infinite;
    }
    .pulse-wave {
      stroke-dasharray: 18 8;
      animation: dashCycle 4s linear infinite;
    }
    .live-dot {
      animation: blinkDot 1.5s ease-in-out infinite;
    }
    .floating-content {
      animation: floatFooter 5s ease-in-out infinite;
    }
    .footer-heading {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 19px;
      letter-spacing: 0.15em;
    }
    .footer-subtitle {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 12.5px;
      fill: #94a3b8;
    }
    .pill-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Base Card Canvas -->
  <rect x="2" y="2" width="896" height="196" rx="16" fill="url(#footerBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Animated Neon Top Gradient Strip -->
  <path d="M 2 18 Q 2 2 18 2 L 882 2 Q 898 2 898 18" fill="none" stroke="url(#footerBorderGrad)" stroke-width="3" filter="url(#footerGlow)" />

  <!-- Background Decorative Grid Dots -->
  <g opacity="0.12" fill="#38bdf8">
    <circle cx="50" cy="40" r="1.5" /><circle cx="100" cy="40" r="1.5" /><circle cx="150" cy="40" r="1.5" /><circle cx="200" cy="40" r="1.5" />
    <circle cx="50" cy="80" r="1.5" /><circle cx="100" cy="80" r="1.5" /><circle cx="150" cy="80" r="1.5" /><circle cx="200" cy="80" r="1.5" />
    <circle cx="50" cy="120" r="1.5" /><circle cx="100" cy="120" r="1.5" /><circle cx="150" cy="120" r="1.5" /><circle cx="200" cy="120" r="1.5" />
    <circle cx="50" cy="160" r="1.5" /><circle cx="100" cy="160" r="1.5" /><circle cx="150" cy="160" r="1.5" /><circle cx="200" cy="160" r="1.5" />
    
    <circle cx="700" cy="40" r="1.5" /><circle cx="750" cy="40" r="1.5" /><circle cx="800" cy="40" r="1.5" /><circle cx="850" cy="40" r="1.5" />
    <circle cx="700" cy="80" r="1.5" /><circle cx="750" cy="80" r="1.5" /><circle cx="800" cy="80" r="1.5" /><circle cx="850" cy="80" r="1.5" />
    <circle cx="700" cy="120" r="1.5" /><circle cx="750" cy="120" r="1.5" /><circle cx="800" cy="120" r="1.5" /><circle cx="850" cy="120" r="1.5" />
    <circle cx="700" cy="160" r="1.5" /><circle cx="750" cy="160" r="1.5" /><circle cx="800" cy="160" r="1.5" /><circle cx="850" cy="160" r="1.5" />
  </g>

  <!-- Animated EKG Pulse Wave Line Across Canvas -->
  <path class="pulse-wave" d="M 30 75 L 340 75 L 355 50 L 370 100 L 385 60 L 400 90 L 415 75 L 485 75 L 500 50 L 515 100 L 530 60 L 545 90 L 560 75 L 870 75" fill="none" stroke="url(#pulseLineGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Floating Content -->
  <g class="floating-content">
    <!-- Center Pulse Shield & Emblem -->
    <g class="heart-logo" filter="url(#iconHalo)">
      <circle cx="450" cy="58" r="24" fill="#131c36" stroke="url(#footerBorderGrad)" stroke-width="1.8" />
      <!-- Heartbeat EKG Path -->
      <path d="M 436 58 L 442 58 L 446 50 L 450 67 L 454 53 L 458 61 L 464 58" fill="none" stroke="#ec4899" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Platform Title -->
    <text x="450" y="112" class="footer-heading" fill="url(#footerTitleGrad)" text-anchor="middle">PULSEWORKSPACE SAAS</text>

    <!-- Subtitle -->
    <text x="450" y="132" class="footer-subtitle" text-anchor="middle">Architected &amp; Engineered by Nived Reddy &#8226; Django 6, DRF, PostgreSQL &amp; Docker</text>

    <!-- Bottom Feature Tag Pills -->
    <g transform="translate(195, 150)">
      <!-- Pill 1: Tenant Isolation -->
      <g transform="translate(0, 0)">
        <rect width="155" height="24" rx="12" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1" />
        <circle cx="14" cy="12" r="3.5" fill="#06b6d4" class="live-dot" />
        <text x="26" y="16" class="pill-label" fill="#67e8f9">Tenant Isolation</text>
      </g>

      <!-- Pill 2: 100% Tests Pass -->
      <g transform="translate(170, 0)">
        <rect width="170" height="24" rx="12" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
        <circle cx="14" cy="12" r="3.5" fill="#10b981" class="live-dot" />
        <text x="26" y="16" class="pill-label" fill="#6ee7b7">100% Tests Passing</text>
      </g>

      <!-- Pill 3: OpenAPI 3.0 -->
      <g transform="translate(355, 0)">
        <rect width="155" height="24" rx="12" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1" />
        <circle cx="14" cy="12" r="3.5" fill="#a855f7" class="live-dot" />
        <text x="26" y="16" class="pill-label" fill="#d8b4fe">OpenAPI 3.0 Live</text>
      </g>
    </g>
  </g>
</svg>
