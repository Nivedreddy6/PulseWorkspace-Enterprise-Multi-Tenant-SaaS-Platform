<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="440">
  <defs>
    <linearGradient id="tdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="testBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09382b" />
      <stop offset="100%" stop-color="#0c1825" />
    </linearGradient>
    <linearGradient id="dockerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2b45" />
      <stop offset="100%" stop-color="#0c1825" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#10b981" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#6366f1;#38bdf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <filter id="tdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes netPulse {
      to { stroke-dashoffset: -30; }
    }
    @keyframes checkPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes liveBlink2 {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .net-dash {
      stroke: #38bdf8;
      stroke-width: 2;
      stroke-dasharray: 6, 6;
      animation: netPulse 1.5s linear infinite;
    }
    .pass-icon {
      animation: checkPulse 3s ease-in-out infinite;
      transform-origin: center;
    }
    .blink-status {
      animation: liveBlink2 1.5s ease-in-out infinite;
    }

    .card-head {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.01em;
      fill: #ffffff;
    }
    .mono-code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
    }
    .sub-text {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 400;
      fill: #94a3b8;
    }
  </style>

  <!-- Container -->
  <rect width="920" height="440" rx="18" fill="url(#tdBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect width="920" height="42" rx="18" fill="#111827" />
  <rect width="920" height="20" y="22" fill="#111827" />
  <line x1="0" y1="42" x2="920" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <text x="460" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">
    Automated Test Matrix &amp; Containerized Docker Infrastructure
  </text>

  <!-- ==========================================
       LEFT: AUTOMATED TEST SUITE (100% PASSING)
       ========================================== -->
  <g transform="translate(30, 65)">
    <rect width="415" height="345" rx="14" fill="url(#testBg)" stroke="url(#neonGreen)" stroke-width="1.5" />
    
    <!-- Top Badge -->
    <rect x="20" y="18" width="130" height="22" rx="11" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="0.8" />
    <text x="85" y="33" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">100% PASSING</text>
    
    <circle cx="390" cy="29" r="4" fill="#34d399" class="blink-status" />
    <text x="380" y="33" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="end">4/4 Tests OK</text>

    <!-- Header Title -->
    <text x="20" y="65" class="card-head">&#129514; Automated Test Suite</text>
    <text x="20" y="82" class="sub-text">python manage.py test &#8226; Zero regression matrix</text>

    <!-- Test Terminal Box -->
    <g transform="translate(18, 96)">
      <rect width="379" height="175" rx="8" fill="rgba(0, 0, 0, 0.55)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      
      <!-- Test 1 -->
      <text x="14" y="28" class="mono-code" fill="#34d399">&#10004; PASS</text>
      <text x="70" y="28" class="mono-code" fill="#f1f5f9">test_tenant_isolation_403</text>
      <text x="70" y="44" font-family="sans-serif" font-size="9.5" fill="#64748b">Cross-tenant boundaries return HTTP 403</text>

      <!-- Test 2 -->
      <text x="14" y="68" class="mono-code" fill="#34d399">&#10004; PASS</text>
      <text x="70" y="68" class="mono-code" fill="#f1f5f9">test_rbac_admin_role_change</text>
      <text x="70" y="84" font-family="sans-serif" font-size="9.5" fill="#64748b">Admin privileges enforce role modifications</text>

      <!-- Test 3 -->
      <text x="14" y="108" class="mono-code" fill="#34d399">&#10004; PASS</text>
      <text x="70" y="108" class="mono-code" fill="#f1f5f9">test_audit_log_creation</text>
      <text x="70" y="124" font-family="sans-serif" font-size="9.5" fill="#64748b">State mutations produce immutable event logs</text>

      <!-- Test 4 -->
      <text x="14" y="148" class="mono-code" fill="#34d399">&#10004; PASS</text>
      <text x="70" y="148" class="mono-code" fill="#f1f5f9">test_billing_quota_limits</text>
      <text x="70" y="164" font-family="sans-serif" font-size="9.5" fill="#64748b">Seat limit limits prevent over-invitations</text>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(18, 285)">
      <rect width="379" height="38" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <text x="189" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">
        Ran 4 tests in 14.063s &#8226; OK
      </text>
    </g>
  </g>

  <!-- ==========================================
       RIGHT: DOCKER COMPOSE INFRASTRUCTURE
       ========================================== -->
  <g transform="translate(475, 65)">
    <rect width="415" height="345" rx="14" fill="url(#dockerBg)" stroke="url(#neonBlue)" stroke-width="1.5" />
    
    <!-- Top Badge -->
    <rect x="20" y="18" width="130" height="22" rx="11" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="0.8" />
    <text x="85" y="33" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#bae6fd" text-anchor="middle">DOCKER READY</text>
    
    <circle cx="390" cy="29" r="4" fill="#38bdf8" class="blink-status" />
    <text x="380" y="33" font-family="sans-serif" font-size="10" fill="#38bdf8" text-anchor="end">2 Services Up</text>

    <!-- Header Title -->
    <text x="20" y="65" class="card-head">&#128011; Docker Container Stack</text>
    <text x="20" y="82" class="sub-text">docker-compose up --build &#8226; Zero config deployment</text>

    <!-- Docker Stack Architecture Box -->
    <g transform="translate(18, 96)">
      <rect width="379" height="175" rx="8" fill="rgba(0, 0, 0, 0.55)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
      
      <!-- Web Container Card -->
      <g transform="translate(14, 16)">
        <rect width="160" height="100" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1" />
        <circle cx="20" cy="22" r="6" fill="#10b981" class="blink-status" />
        <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">web</text>
        <rect x="95" y="14" width="55" height="16" rx="4" fill="#1e3a8a" />
        <text x="122" y="26" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93c5fd" text-anchor="middle">:8000</text>
        <text x="14" y="52" class="sub-text" font-size="10">&#8226; Django 6 + Gunicorn</text>
        <text x="14" y="68" class="sub-text" font-size="10">&#8226; Python 3.14 venv</text>
        <text x="14" y="84" class="sub-text" font-size="10">&#8226; Staticfiles collected</text>
      </g>

      <!-- Connecting Animated Bridge Line -->
      <line x1="174" y1="66" x2="204" y2="66" class="net-dash" />

      <!-- DB Container Card -->
      <g transform="translate(204, 16)">
        <rect width="160" height="100" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
        <circle cx="20" cy="22" r="6" fill="#10b981" class="blink-status" />
        <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">db</text>
        <rect x="95" y="14" width="55" height="16" rx="4" fill="#075985" />
        <text x="122" y="26" font-family="'JetBrains Mono', monospace" font-size="9" fill="#7dd3fc" text-anchor="middle">:5432</text>
        <text x="14" y="52" class="sub-text" font-size="10">&#8226; Postgres 16 Alpine</text>
        <text x="14" y="68" class="sub-text" font-size="10">&#8226; Persistent volume</text>
        <text x="14" y="84" class="sub-text" font-size="10">&#8226; Isolated bridge net</text>
      </g>

      <!-- Internal Network Status -->
      <g transform="translate(14, 130)">
        <rect width="350" height="30" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
        <text x="175" y="19" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7dd3fc" text-anchor="middle">
          Network: pulseworkspace_default &#8226; depends_on: db
        </text>
      </g>
    </g>

    <!-- Bottom Command Bar -->
    <g transform="translate(18, 285)">
      <rect width="379" height="38" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
      <text x="189" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">
        $ docker-compose up --build -d
      </text>
    </g>
  </g>
</svg>
