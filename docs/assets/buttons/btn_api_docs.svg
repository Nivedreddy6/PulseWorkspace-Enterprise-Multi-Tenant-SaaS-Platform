<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 42" width="142" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081e18" />
      <stop offset="100%" stop-color="#0e3025" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGradApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#34d399;#10b981" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#34d399;#10b981;#06b6d4" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#10b981;#06b6d4;#34d399" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmer Highlight Beam -->
    <linearGradient id="shimmerBeamApi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.35)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="iconGlowApi" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.8" />
    </filter>

    <clipPath id="btnClipApi">
      <rect x="1" y="1" width="140" height="40" rx="20" />
    </clipPath>
  </defs>

  <style>
    @keyframes sweepApi {
      0% { transform: translateX(-120px) skewX(-25deg); }
      50%, 100% { transform: translateX(210px) skewX(-25deg); }
    }
    @keyframes pulseRingApi {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .shimmer {
      animation: sweepApi 3.4s ease-in-out infinite 1.2s;
    }
    .btn-text {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      fill: #ffffff;
    }
    .pulse-radar {
      transform-origin: 22px 21px;
      animation: pulseRingApi 2s ease-in-out infinite;
    }
  </style>

  <!-- Button Container Clipped -->
  <g clip-path="url(#btnClipApi)">
    <!-- Base Background -->
    <rect x="1" y="1" width="140" height="40" rx="20" fill="url(#bgGradApi)" />

    <!-- Animated Light Sweep Beam -->
    <rect class="shimmer" x="0" y="0" width="45" height="42" fill="url(#shimmerBeamApi)" />
  </g>

  <!-- Button Border with Gradient -->
  <rect x="1" y="1" width="140" height="40" rx="20" fill="none" stroke="url(#borderGradApi)" stroke-width="1.8" />

  <!-- Animated API Dish / Radar Icon -->
  <g class="pulse-radar" filter="url(#iconGlowApi)">
    <circle cx="22" cy="21" r="3" fill="#34d399" />
    <path d="M17 16 A8 8 0 0 1 27 16" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" />
    <path d="M14 13 A13 13 0 0 1 30 13" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M22 24 L22 30 M18 30 L26 30" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Button Label -->
  <text x="37" y="26" class="btn-text">API Docs</text>

  <!-- Subtle Arrow indicator -->
  <path d="M121 18 L125 21 L121 24" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>
