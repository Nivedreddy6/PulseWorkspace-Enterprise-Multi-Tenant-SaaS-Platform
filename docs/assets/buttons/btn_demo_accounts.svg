<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 42" width="170" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradDemo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1408" />
      <stop offset="100%" stop-color="#2d1e0a" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGradDemo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24">
        <animate attributeName="stop-color" values="#fbbf24;#f59e0b;#eab308;#fbbf24" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b;#eab308;#fbbf24;#f59e0b" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#eab308">
        <animate attributeName="stop-color" values="#eab308;#fbbf24;#f59e0b;#eab308" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmer Highlight Beam -->
    <linearGradient id="shimmerBeamDemo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.35)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="iconGlowDemo" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fbbf24" flood-opacity="0.8" />
    </filter>

    <clipPath id="btnClipDemo">
      <rect x="1" y="1" width="168" height="40" rx="20" />
    </clipPath>
  </defs>

  <style>
    @keyframes sweepDemo {
      0% { transform: translateX(-120px) skewX(-25deg); }
      50%, 100% { transform: translateX(240px) skewX(-25deg); }
    }
    @keyframes wiggleKey {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
    .shimmer {
      animation: sweepDemo 3.8s ease-in-out infinite 1.6s;
    }
    .btn-text {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      fill: #ffffff;
    }
    .wiggle-key {
      transform-origin: 23px 21px;
      animation: wiggleKey 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Button Container Clipped -->
  <g clip-path="url(#btnClipDemo)">
    <!-- Base Background -->
    <rect x="1" y="1" width="168" height="40" rx="20" fill="url(#bgGradDemo)" />

    <!-- Animated Light Sweep Beam -->
    <rect class="shimmer" x="0" y="0" width="45" height="42" fill="url(#shimmerBeamDemo)" />
  </g>

  <!-- Button Border with Gradient -->
  <rect x="1" y="1" width="168" height="40" rx="20" fill="none" stroke="url(#borderGradDemo)" stroke-width="1.8" />

  <!-- Animated Key Icon -->
  <g class="wiggle-key" filter="url(#iconGlowDemo)">
    <!-- Key Ring -->
    <circle cx="21" cy="18" r="5" fill="none" stroke="#fde047" stroke-width="2" />
    <!-- Key Stem -->
    <path d="M25 21 L31 27 M28 24 L29.5 22.5 M30 26 L31.5 24.5" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Button Label -->
  <text x="39" y="26" class="btn-text">Demo Accounts</text>

  <!-- Subtle Arrow indicator -->
  <path d="M149 18 L153 21 L149 24" fill="none" stroke="#fde047" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>
