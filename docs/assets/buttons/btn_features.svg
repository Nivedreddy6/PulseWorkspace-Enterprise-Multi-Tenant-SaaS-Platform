<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 142 42" width="142" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradFeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f2c" />
      <stop offset="100%" stop-color="#281442" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGradFeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#8b5cf6;#a855f7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#8b5cf6;#a855f7;#ec4899" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#a855f7;#ec4899;#8b5cf6" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmer Highlight Beam -->
    <linearGradient id="shimmerBeamFeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.35)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="iconGlowFeat" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#a855f7" flood-opacity="0.8" />
    </filter>

    <clipPath id="btnClipFeat">
      <rect x="1" y="1" width="140" height="40" rx="20" />
    </clipPath>
  </defs>

  <style>
    @keyframes sweepFeat {
      0% { transform: translateX(-120px) skewX(-25deg); }
      50%, 100% { transform: translateX(210px) skewX(-25deg); }
    }
    @keyframes spinSparkle {
      0% { transform: rotate(0deg) scale(0.9); }
      50% { transform: rotate(90deg) scale(1.15); }
      100% { transform: rotate(180deg) scale(0.9); }
    }
    .shimmer {
      animation: sweepFeat 3.7s ease-in-out infinite 0.8s;
    }
    .btn-text {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      fill: #ffffff;
    }
    .sparkle-icon {
      transform-origin: 23px 21px;
      animation: spinSparkle 4s ease-in-out infinite;
    }
  </style>

  <!-- Button Container Clipped -->
  <g clip-path="url(#btnClipFeat)">
    <!-- Base Background -->
    <rect x="1" y="1" width="140" height="40" rx="20" fill="url(#bgGradFeat)" />

    <!-- Animated Light Sweep Beam -->
    <rect class="shimmer" x="0" y="0" width="45" height="42" fill="url(#shimmerBeamFeat)" />
  </g>

  <!-- Button Border with Gradient -->
  <rect x="1" y="1" width="140" height="40" rx="20" fill="none" stroke="url(#borderGradFeat)" stroke-width="1.8" />

  <!-- Animated Star Sparkle Icon -->
  <g class="sparkle-icon" filter="url(#iconGlowFeat)">
    <path d="M23 12 C23 16 26 19 30 21 C26 23 23 26 23 30 C23 26 20 23 16 21 C20 19 23 16 23 12 Z" fill="#f472b6" stroke="#c084fc" stroke-width="0.5" />
    <circle cx="23" cy="21" r="2" fill="#ffffff" />
  </g>

  <!-- Button Label -->
  <text x="38" y="26" class="btn-text">Features</text>

  <!-- Subtle Arrow indicator -->
  <path d="M121 18 L125 21 L121 24" fill="none" stroke="#f472b6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>
