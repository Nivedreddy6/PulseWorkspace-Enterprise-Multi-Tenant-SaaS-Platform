<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 42" width="176" height="42">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradTest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111633" />
      <stop offset="100%" stop-color="#1d224d" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGradTest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#38bdf8;#a855f7;#6366f1" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#6366f1;#38bdf8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#6366f1;#38bdf8;#a855f7" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmer Highlight Beam -->
    <linearGradient id="shimmerBeamTest" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.35)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="iconGlowTest" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#818cf8" flood-opacity="0.8" />
    </filter>

    <clipPath id="btnClipTest">
      <rect x="1" y="1" width="174" height="40" rx="20" />
    </clipPath>
  </defs>

  <style>
    @keyframes sweepTest {
      0% { transform: translateX(-120px) skewX(-25deg); }
      50%, 100% { transform: translateX(250px) skewX(-25deg); }
    }
    @keyframes bubbleFlask {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-2px) rotate(3deg); }
    }
    .shimmer {
      animation: sweepTest 3.5s ease-in-out infinite 2s;
    }
    .btn-text {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      fill: #ffffff;
    }
    .flask-icon {
      transform-origin: 23px 21px;
      animation: bubbleFlask 2.2s ease-in-out infinite;
    }
  </style>

  <!-- Button Container Clipped -->
  <g clip-path="url(#btnClipTest)">
    <!-- Base Background -->
    <rect x="1" y="1" width="174" height="40" rx="20" fill="url(#bgGradTest)" />

    <!-- Animated Light Sweep Beam -->
    <rect class="shimmer" x="0" y="0" width="45" height="42" fill="url(#shimmerBeamTest)" />
  </g>

  <!-- Button Border with Gradient -->
  <rect x="1" y="1" width="174" height="40" rx="20" fill="none" stroke="url(#borderGradTest)" stroke-width="1.8" />

  <!-- Animated Flask / Docker Test Icon -->
  <g class="flask-icon" filter="url(#iconGlowTest)">
    <!-- Flask Outline -->
    <path d="M21 11 L25 11 M23 11 L23 17 L29 27 C29.8 28.3 28.8 30 27.2 30 L18.8 30 C17.2 30 16.2 28.3 17 27 L23 17 Z" fill="rgba(99, 102, 241, 0.35)" stroke="#a5b4fc" stroke-width="1.6" stroke-linejoin="round" />
    <!-- Liquid / Bubble -->
    <circle cx="21" cy="25" r="1.5" fill="#38bdf8" />
    <circle cx="25" cy="27" r="1" fill="#c084fc" />
  </g>

  <!-- Button Label -->
  <text x="39" y="26" class="btn-text">Testing &amp; Docker</text>

  <!-- Subtle Arrow indicator -->
  <path d="M155 18 L159 21 L155 24" fill="none" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
</svg>
