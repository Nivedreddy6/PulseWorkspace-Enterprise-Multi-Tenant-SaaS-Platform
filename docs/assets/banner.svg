<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Dynamic Animated Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16">
        <animate attributeName="stop-color" values="#090d16;#0f172a;#090d16" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#1e1b4b;#111827" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#030712">
        <animate attributeName="stop-color" values="#030712;#0f172a;#030712" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#06b6d4;#ec4899;#6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#ec4899;#a855f7;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#6366f1;#06b6d4;#a855f7" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.08); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .floating-badge {
      animation: float 4s ease-in-out infinite;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: center;
    }
    .grid-line {
      stroke: rgba(99, 102, 241, 0.15);
      stroke-dasharray: 4, 4;
      animation: dash 20s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="896" height="256" x="2" y="2" rx="15" fill="none" stroke="url(#glowBorder)" stroke-width="1.5" opacity="0.6" />

  <!-- Animated Glowing Orbs in Background -->
  <circle cx="150" cy="70" r="90" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="750" cy="190" r="100" fill="#06b6d4" opacity="0.12" filter="url(#glow)" class="pulse-circle" />
  <circle cx="450" cy="130" r="80" fill="#ec4899" opacity="0.1" filter="url(#glow)" class="pulse-circle" />

  <!-- Dynamic Tech Grid Lines -->
  <line x1="60" y1="50" x2="840" y2="50" class="grid-line" />
  <line x1="60" y1="210" x2="840" y2="210" class="grid-line" />

  <!-- Animated Logo Icon -->
  <g transform="translate(60, 65)" class="floating-badge">
    <rect width="70" height="70" rx="18" fill="url(#textGrad)" filter="url(#softGlow)" />
    <path d="M22 25 L48 25 L48 31 L22 31 Z M22 35 L42 35 L42 41 L22 41 Z M22 45 L36 45 L36 51 L22 51 Z" fill="#ffffff" />
    <circle cx="50" cy="48" r="4" fill="#38bdf8" filter="url(#softGlow)">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Title & Subtitle -->
  <text x="150" y="105" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
    PulseWorkspace
  </text>
  
  <text x="152" y="132" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Enterprise Multi-Tenant SaaS Platform • Django 6 &amp; DRF • RBAC • Audit Trails
  </text>

  <!-- Floating Feature Tags (Pills) -->
  <g transform="translate(150, 160)">
    <!-- Pill 1: Multi-Tenancy -->
    <g transform="translate(0, 0)">
      <rect width="135" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#818cf8" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">Multi-Tenant</text>
    </g>

    <!-- Pill 2: RBAC Matrix -->
    <g transform="translate(145, 0)">
      <rect width="130" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#34d399" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">RBAC Security</text>
    </g>

    <!-- Pill 3: Audit Trails -->
    <g transform="translate(285, 0)">
      <rect width="135" height="28" rx="14" fill="#4c1d95" stroke="#a855f7" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#c084fc" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#e9d5ff">SOC2 Audit Logs</text>
    </g>

    <!-- Pill 4: Swagger 3.0 -->
    <g transform="translate(430, 0)">
      <rect width="130" height="28" rx="14" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#fbbf24" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#fde68a">OpenAPI 3.0</text>
    </g>

    <!-- Pill 5: Docker Ready -->
    <g transform="translate(570, 0)">
      <rect width="120" height="28" rx="14" fill="#164e63" stroke="#06b6d4" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#bae6fd">Dockerized</text>
    </g>
  </g>
</svg>
