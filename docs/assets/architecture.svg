<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="380">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="cardGradIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cardGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cardGradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cardGradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cardGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Animated Path Gradients -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#06b6d4;#6366f1" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#6366f1;#06b6d4" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes dashflow {
      to { stroke-dashoffset: -32; }
    }
    .flow-line {
      stroke: #6366f1;
      stroke-width: 2;
      stroke-dasharray: 6, 6;
      animation: dashflow 1.5s linear infinite;
    }
    .flow-line-cyan {
      stroke: #06b6d4;
      stroke-width: 2;
      stroke-dasharray: 6, 6;
      animation: dashflow 1.5s linear infinite;
    }
    .flow-line-purple {
      stroke: #a855f7;
      stroke-width: 2;
      stroke-dasharray: 6, 6;
      animation: dashflow 1.5s linear infinite;
    }
    .card-title {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 700;
      font-size: 13px;
    }
    .card-subtitle {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 500;
      font-size: 10.5px;
      fill: #94a3b8;
    }
  </style>

  <!-- Container Box -->
  <rect width="860" height="380" rx="16" fill="url(#bgArch)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5" />

  <!-- Diagram Title -->
  <text x="36" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    System Architecture &amp; Data Flow
  </text>
  <text x="36" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#64748b">
    Isolated tenant namespaces with Role-Based Access Control and synchronous audit telemetry
  </text>

  <!-- Connecting Lines -->
  <!-- Client to Auth -->
  <line x1="170" y1="140" x2="230" y2="140" class="flow-line" />
  
  <!-- Security Gateway to Tenant Workspaces -->
  <path d="M 380 140 L 440 110" class="flow-line" fill="none" />
  <path d="M 380 140 L 440 210" class="flow-line-purple" fill="none" />
  
  <!-- Workspaces to Storage & Audit -->
  <path d="M 590 110 L 650 140" class="flow-line-cyan" fill="none" />
  <path d="M 590 210 L 650 140" class="flow-line-cyan" fill="none" />
  <path d="M 515 250 L 515 300" class="flow-line-purple" fill="none" />
  <path d="M 305 180 L 305 300" class="flow-line" fill="none" />

  <!-- ================= NODE 1: CLIENTS ================= -->
  <g transform="translate(30, 95)">
    <rect width="140" height="90" rx="12" fill="url(#cardGradIndigo)" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="#312e81" />
    <text x="28" y="34" font-size="12" text-anchor="middle" fill="#818cf8">🌐</text>
    <text x="50" y="34" class="card-title" fill="#c7d2fe">Clients Layer</text>
    <text x="20" y="58" class="card-subtitle">• Web UI (Templates)</text>
    <text x="20" y="73" class="card-subtitle">• REST APIs (Tokens)</text>
  </g>

  <!-- ================= NODE 2: GATEWAY & RBAC ================= -->
  <g transform="translate(230, 85)">
    <rect width="150" height="110" rx="12" fill="url(#cardGradAmber)" stroke="#f59e0b" stroke-width="1.5" filter="url(#nodeGlow)" />
    <circle cx="28" cy="30" r="14" fill="#78350f" />
    <text x="28" y="34" font-size="12" text-anchor="middle" fill="#fbbf24">🛡️</text>
    <text x="50" y="34" class="card-title" fill="#fde68a">Security Guard</text>
    <text x="20" y="58" class="card-subtitle">• IsWorkspaceMember</text>
    <text x="20" y="73" class="card-subtitle">• RBAC (Owner/Admin)</text>
    <text x="20" y="88" class="card-subtitle">• 403 Forbidden Gate</text>
  </g>

  <!-- ================= NODE 3A: TENANT A ================= -->
  <g transform="translate(440, 65)">
    <rect width="150" height="85" rx="12" fill="url(#cardGradEmerald)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="28" cy="28" r="12" fill="#064e3b" />
    <text x="28" y="32" font-size="11" text-anchor="middle" fill="#34d399">🏢</text>
    <text x="48" y="32" class="card-title" fill="#a7f3d0">Tenant Alpha</text>
    <text x="18" y="54" class="card-subtitle">• Projects &amp; Tasks</text>
    <text x="18" y="68" class="card-subtitle">• Pro Tier ($49/mo)</text>
  </g>

  <!-- ================= NODE 3B: TENANT B ================= -->
  <g transform="translate(440, 165)">
    <rect width="150" height="85" rx="12" fill="url(#cardGradPurple)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="28" cy="28" r="12" fill="#3b0764" />
    <text x="28" y="32" font-size="11" text-anchor="middle" fill="#c084fc">🚀</text>
    <text x="48" y="32" class="card-title" fill="#e9d5ff">Tenant Beta</text>
    <text x="18" y="54" class="card-subtitle">• Isolated Projects</text>
    <text x="18" y="68" class="card-subtitle">• Free Starter Plan</text>
  </g>

  <!-- ================= NODE 4: DATABASE ================= -->
  <g transform="translate(650, 95)">
    <rect width="180" height="90" rx="12" fill="url(#cardGradCyan)" stroke="#06b6d4" stroke-width="1.5" filter="url(#nodeGlow)" />
    <circle cx="28" cy="30" r="14" fill="#083344" />
    <text x="28" y="34" font-size="12" text-anchor="middle" fill="#38bdf8">💾</text>
    <text x="50" y="34" class="card-title" fill="#bae6fd">Persistence Layer</text>
    <text x="20" y="58" class="card-subtitle">• Postgres / SQLite3</text>
    <text x="20" y="73" class="card-subtitle">• Atomic Transactions</text>
  </g>

  <!-- ================= NODE 5: AUDIT LOGS & COMPLIANCE ================= -->
  <g transform="translate(230, 290)">
    <rect width="360" height="65" rx="12" fill="#171e2e" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="26" cy="32" r="13" fill="#312e81" />
    <text x="26" y="36" font-size="11" text-anchor="middle" fill="#818cf8">📋</text>
    <text x="48" y="28" class="card-title" fill="#f8fafc">Immutable Audit Trail (SOC2 Compliance)</text>
    <text x="48" y="48" class="card-subtitle">Actor • Action (CREATE/UPDATE/ROLE) • IP Address • Timestamps • Gated by Plan</text>
  </g>

  <!-- ================= NODE 6: SWAGGER OPENAPI ================= -->
  <g transform="translate(650, 290)">
    <rect width="180" height="65" rx="12" fill="#171e2e" stroke="#10b981" stroke-width="1.5" />
    <circle cx="26" cy="32" r="13" fill="#064e3b" />
    <text x="26" y="36" font-size="11" text-anchor="middle" fill="#34d399">⚡</text>
    <text x="48" y="28" class="card-title" fill="#a7f3d0">OpenAPI 3.0 Specs</text>
    <text x="48" y="48" class="card-subtitle">drf-spectacular /api/docs/</text>
  </g>
</svg>
